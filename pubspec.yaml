name: smart_grocery_pos
description: "Smart Grocery POS System - Billing & Inventory Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Fonts & UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Barcode Scanner
  mobile_scanner: ^5.1.1

  # PDF Invoice Generation
  pdf: ^3.11.0
  printing: ^5.13.1

  # Excel Export
  excel: ^4.0.6

  # Charts (Sales Analytics)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Uncomment and add assets once you have them
  # assets:
  #   - assets/images/
  #   - assets/icons/
